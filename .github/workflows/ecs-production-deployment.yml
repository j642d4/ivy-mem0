name: MEM0 CI/CD Pipeline - Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Existing ECR image tag (used for both backend and dashboard) to redeploy as-is (skips the build/push step).
          Leave empty to build fresh from the branch/tag selected above.
        required: false
        type: string
        default: ""

env:
  C_NAME: "ivy-mem0-production"
  CLUSTER_NAME: "ivy-ecs-cluster-production"
  ECS_SERVICE: "ivy-mem0"
  TR_ARN: "ecs-task-role-ivy-mem0-production"
  ER_ARN: "ecs-task-execution-role-ivy-mem0-production"
  AWS_LG: "/ecs/production/ivy-mem0"
  AWS_SP: "mem0"
  T_FAMILY: "ivy-mem0-production"
  ECR_REPOSITORY_NAME_BACKEND: "ivy-backend-production"
  ECR_REPOSITORY_NAME_DASHBOARD: "ivy-frontend-production"

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' && inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag backend image
        id: build-backend
        run: |
          IMAGE_TAG="${{ github.ref_name }}"
          BACKEND_IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY_NAME_BACKEND:$IMAGE_TAG"

          docker build \
            -t $BACKEND_IMAGE_URI -f server/dev.Dockerfile .

          echo "BACKEND_IMAGE_URI=$BACKEND_IMAGE_URI" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and tag dashboard image
        id: build-dashboard
        run: |
          IMAGE_TAG="${{ github.ref_name }}"
          DASHBOARD_IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY_NAME_DASHBOARD:$IMAGE_TAG"

          docker build \
            --build-arg NEXT_BASE_PATH=/mem0 \
            -t $DASHBOARD_IMAGE_URI -f server/dashboard/Dockerfile server/dashboard

          echo "DASHBOARD_IMAGE_URI=$DASHBOARD_IMAGE_URI" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Push images to Amazon ECR
        run: |
          docker push ${{ env.BACKEND_IMAGE_URI }}
          docker push ${{ env.DASHBOARD_IMAGE_URI }}

      - name: Tag latest and push latest
        run: |
          docker tag ${{ env.BACKEND_IMAGE_URI }} \
                     ${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY_NAME_BACKEND:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY_NAME_BACKEND:latest

          docker tag ${{ env.DASHBOARD_IMAGE_URI }} \
                     ${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY_NAME_DASHBOARD:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY_NAME_DASHBOARD:latest

    outputs:
      image_tag: ${{ steps.build-backend.outputs.image_tag }}

  deploy:
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve image tag to deploy
        id: img
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ needs.build-and-push.outputs.image_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Verify images exist in ECR
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY_NAME_BACKEND" \
            --image-ids imageTag="${{ steps.img.outputs.tag }}" \
            --region ${{ vars.AWS_REGION }} > /dev/null

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY_NAME_DASHBOARD" \
            --image-ids imageTag="${{ steps.img.outputs.tag }}" \
            --region ${{ vars.AWS_REGION }} > /dev/null

      - name: Resolve task definition placeholders
        run: |
          BACKEND_IMAGE="${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_NAME_BACKEND }}:${{ steps.img.outputs.tag }}"
          DASHBOARD_IMAGE="${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_NAME_DASHBOARD }}:${{ steps.img.outputs.tag }}"

          sed \
            -e "s|<ACCOUNT_ID>|${{ secrets.AWS_ACCOUNT_ID_PROD }}|g" \
            -e "s|<AWS_REGION>|${{ vars.AWS_REGION }}|g" \
            -e "s|<TR_ARN>|${{ env.TR_ARN }}|g" \
            -e "s|<ER_ARN>|${{ env.ER_ARN }}|g" \
            -e "s|<AWS_LG>|${{ env.AWS_LG }}|g" \
            -e "s|<T_FAMILY>|${{ env.T_FAMILY }}|g" \
            -e "s|<BACKEND_IMAGE>|$BACKEND_IMAGE|g" \
            -e "s|<DASHBOARD_IMAGE>|$DASHBOARD_IMAGE|g" \
            ecs_task_definition.production.json > resolved-task-definition.json

      - name: Deploy updated task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: resolved-task-definition.json
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Show ECS service logs
        if: failure()
        run: aws logs tail "$AWS_LG" --since 15m --format short
